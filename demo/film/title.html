<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  h1 { margin: 0; font-size: 104px; letter-spacing: -2px; font-weight: 700; }
  p { margin: 18px 0 0; font-size: 40px; color: #c9d3ff; }
</style>
</head>
<body>
<div class="wrap"><h1 id="h">Pinboard</h1><p id="p">A new note in two clicks</p></div>
<script type="module">
const h = document.getElementById('h');
const p = document.getElementById('p');
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
function frame(t) {
  const a = ease(t / 0.6);
  const b = ease((t - 0.25) / 0.6);
  const out = ease((t - 2.1) / 0.4);
  h.style.opacity = String(a * (1 - out));
  h.style.transform = `translateY(${(1 - a) * 30 - out * 20}px)`;
  p.style.opacity = String(b * (1 - out));
  p.style.transform = `translateY(${(1 - b) * 30 - out * 20}px)`;
}
window.film = { frame, duration: 2.5 };
if (!window.filmHost) { const t0 = performance.now(); const loop = () => { frame(((performance.now() - t0) / 1000) % 2.5); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
</html>
